services:
  commafeed:
    image: athou/commafeed:latest-postgresql
    container_name: commafeed
    restart: unless-stopped

    ports:
      - "8073:8082"

    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://${DATABASE_URL}/commafeed
      QUARKUS_DATASOURCE_USERNAME: ${DATABASE_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${DATABASE_PASS}

    volumes:
      - data:/commafeed/data

volumes:
  data:
    name: commafeed_data
